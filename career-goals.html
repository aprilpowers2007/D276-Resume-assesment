<section>
  <h2>Contact Form</h2>
  <form action="https://wp.zybooks.com/form-viewer.php" method="POST">
    <div class="form-group">
      <label for="fname">First Name:</label>
      <input type="text" id="fname" name="fname" required>
    </div>

    <div class="form-group">
      <label for="lname">Last Name:</label>
      <input type="text" id="lname" name="lname" required>
    </div>

    <div class="form-group">
      <label for="company">Company Name:</label>
      <input type="text" id="company" name="company">
    </div>

    <div class="form-group">
      <label for="email">Email Address:</label>
      <input type="email" id="email" name="email" required>
    </div>

    <div class="form-group">
      <label for="phone">Phone Number:</label>
      <input type="tel" id="phone" name="phone">
    </div>

    <div class="form-group">
      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="4"></textarea>
    </div>

    <fieldset>
      <legend>Best Contact Time:</legend>
      <label><input type="radio" id="am" name="time" value="a.m."> a.m.</label>
      <label><input type="radio" id="pm" name="time" value="p.m."> p.m.</label>
      <label><input type="radio" id="any" name="time" value="anytime" checked> anytime</label>
    </fieldset>

    <div class="form-group">
      <label for="contact_method">Preferred Contact Method:</label>
      <select id="contact_method" name="contact_method">
        <option value="phone">phone</option>
        <option value="email">email</option>
        <option value="text">text</option>
      </select>
    </div>

    <input type="submit" value="Submit">
  </form>
</section>
